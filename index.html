  const items = [...state.honeyDo].sort((a,b) => (a.done - b.done) || ({high:0,normal:1,low:2}[a.priority]-{high:0,normal:1,low:2}[b.priority]));
  if (!items.length) { list.innerHTML = '<div class="text-xs text-gray-400 text-center py-4">Nothing on the list. Add a project!</div>'; return; }
  list.innerHTML = items.map(h => `<div class="flex items-start gap-2.5 bg-gray-50 rounded-xl px-3 py-2.5">
    <input type="checkbox" class="chk mt-0.5" ${h.done?'checked':''} onchange="toggleHoneyDone('${h.id}', this.checked)">
    <div class="min-w-0 flex-1 cursor-pointer" onclick="openHoneyDoModal('${h.id}')">
      <div class="text-sm font-semibold ${h.done?'line-through text-gray-400':'text-gray-800'}">${escapeHtml(h.title)}</div>
      <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
        ${h.personId ? personChip(h.personId) : '<span class="text-[10px] text-gray-400">Whole family</span>'}
        ${h.priority==='high'?'<span class="text-[10px] font-bold text-red-500">High priority</span>':''}
      </div>
    </div>
  </div>`).join('');
}
function toggleHoneyDone(id, checked) {
  const h = state.honeyDo.find(x => x.id === id);
  h.done = checked; h.doneAt = checked ? new Date().toISOString() : null;
  saveState(); renderHoneyDo();
}
function openHoneyDoModal(id) {
  document.getElementById('honeyId').value = id || '';
  document.getElementById('honeyPerson').innerHTML = '<option value="">Anyone / Whole family</option>' + personOptions(null);
  document.getElementById('honeyDeleteBtn').classList.toggle('hidden', !id);
  if (id) {
    const h = state.honeyDo.find(x => x.id === id);
    document.getElementById('honeyTitle').value = h.title;
    document.getElementById('honeyPerson').value = h.personId || '';
    document.getElementById('honeyPriority').value = h.priority || 'normal';
    document.getElementById('honeyNotes').value = h.notes || '';
  } else {
    document.getElementById('honeyTitle').value = '';
    document.getElementById('honeyPerson').value = '';
    document.getElementById('honeyPriority').value = 'normal';
    document.getElementById('honeyNotes').value = '';
  }
  openModal('honeyDoModal');
}
function saveHoneyDo() {
  const id = document.getElementById('honeyId').value;
  const title = document.getElementById('honeyTitle').value.trim();
  if (!title) { toast('Give it a title', 'fa-triangle-exclamation'); return; }
  const data = {
    title, personId: document.getElementById('honeyPerson').value || null,
    priority: document.getElementById('honeyPriority').value,
    notes: document.getElementById('honeyNotes').value.trim()
  };
  if (id) Object.assign(state.honeyDo.find(x => x.id === id), data);
  else state.honeyDo.push({ id: uid('hd'), done:false, createdAt: new Date().toISOString(), ...data });
  closeModal('honeyDoModal');
  saveState(); renderHoneyDo();
}
function deleteHoneyDo() {
  const id = document.getElementById('honeyId').value;
  if (!confirm('Delete this item?')) return;
  state.honeyDo = state.honeyDo.filter(x => x.id !== id);
  closeModal('honeyDoModal');
  saveState(); renderHoneyDo();
}

/* =========================== YEARLY CHORE (HEADER) =========================== */
function renderHeader() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('headerMonthLabel').textContent = monthNames[calMonth]+' '+calYear;
  const [g1,g2] = MONTH_GRADIENTS[calMonth];
  const banner = document.getElementById('yearlyChoreBanner');
  if (banner) banner.style.background = `linear-gradient(135deg, ${g1}, ${g2})`;
  const yc = state.yearlyChores.find(y => y.month === calMonth+1);
  document.getElementById('yearlyChoreTitle').textContent = yc ? yc.title : '--';
  const key = calYear+'-'+(calMonth+1);
  const comp = state.yearlyCompletions[key] || {};
  const total = yc ? (yc.subtasks||[]).length : 0;
  const done = yc ? (yc.subtasks||[]).filter(s => comp[s.id]).length : 0;
  document.getElementById('yearlyChoreProgress').textContent = total ? `${done}/${total}` : '';
}

function openYearlyChoreModal() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const editor = document.getElementById('yearlyChoreEditor');
  editor.innerHTML = monthNames.map((m,i) => {
    const yc = state.yearlyChores.find(y => y.month === i+1) || { id: uid('yc'), month: i+1, title: m+' Family Chore', subtasks: [] };
    if (!state.yearlyChores.find(y => y.month === i+1)) state.yearlyChores.push(yc);
    const isCurrent = i === calMonth;
    const key = calYear+'-'+(i+1);
    const comp = state.yearlyCompletions[key] || {};
    const [mg1,mg2] = MONTH_GRADIENTS[i];
    return `<div class="rounded-xl border p-2.5" style="border-color:${mg1}55;${isCurrent?`background:linear-gradient(135deg,${mg1}14,${mg2}14)`:''}">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <div class="text-[10px] font-bold uppercase tracking-wide flex items-center gap-1.5" style="color:${mg1}"><span class="inline-block w-2.5 h-2.5 rounded-full" style="background:linear-gradient(135deg,${mg1},${mg2})"></span>${m}${isCurrent?' · Current':''}</div>
      </div>
      <input type="text" value="${escapeHtml(yc.title)}" onchange="updateYearlyTitle(${i+1}, this.value)" class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm font-semibold mb-2">
      <div id="ycSubs-${i+1}" class="space-y-1">
        ${(yc.subtasks||[]).map(s => `<div class="subtask-row">
          ${isCurrent?`<input type="checkbox" class="chk" ${comp[s.id]?'checked':''} onchange="toggleYearlySubtask(${i+1}, '${s.id}', this.checked)">`:'<span class="w-[18px] h-[18px] flex-shrink-0"></span>'}
          <span class="text-sm flex-1 ${isCurrent&&comp[s.id]?'line-through text-gray-400':''}">${escapeHtml(s.text)}</span>
          ${s.personId?personChip(s.personId):''}
          <button onclick="removeYearlySubtask(${i+1}, '${s.id}')" class="text-gray-300"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>`).join('')}
      </div>
      <div class="flex gap-1.5 mt-1.5">
        <input type="text" id="ycNewSub-${i+1}" placeholder="Add step..." class="flex-1 border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs">
        <select id="ycNewSubPerson-${i+1}" class="border border-gray-200 rounded-lg px-1.5 py-1.5 text-xs">${personOptions(null,'Anyone')}</select>
        <button onclick="addYearlySubtask(${i+1})" class="w-8 h-8 flex-shrink-0 rounded-lg bg-purple-100 text-purple-600"><i class="fa-solid fa-plus text-xs"></i></button>
      </div>
    </div>`;
  }).join('');
  openModal('yearlyChoreModal');
}
function updateYearlyTitle(month, val) { const yc = state.yearlyChores.find(y=>y.month===month); yc.title = val; saveState(); renderHeader(); }
function addYearlySubtask(month) {
  const input = document.getElementById('ycNewSub-'+month);
  const text = input.value.trim();
  if (!text) return;
  const personId = document.getElementById('ycNewSubPerson-'+month).value || null;
  const yc = state.yearlyChores.find(y => y.month === month);
  yc.subtasks = yc.subtasks || [];
  yc.subtasks.push({ id: uid('ycs'), text, personId });
  saveState(); openYearlyChoreModal();
}
function removeYearlySubtask(month, subId) {
  const yc = state.yearlyChores.find(y => y.month === month);
  yc.subtasks = (yc.subtasks||[]).filter(s => s.id !== subId);
  saveState(); openYearlyChoreModal();
}
function toggleYearlySubtask(month, subId, checked) {
  const key = calYear+'-'+month;
  state.yearlyCompletions[key] = state.yearlyCompletions[key] || {};
  state.yearlyCompletions[key][subId] = checked;
  saveState(); renderHeader();
}

/* =========================== PROFILES / SETTINGS =========================== */
function renderProfiles() {
  document.getElementById('peopleList').innerHTML = state.people.map(p => `<div class="flex items-center gap-2 bg-gray-50 rounded-xl px-2.5 py-2">
    <input type="color" value="${p.color}" onchange="updatePersonColor('${p.id}', this.value)" class="w-8 h-8 rounded-lg border-0 flex-shrink-0" style="background:${p.color}">
    <input type="text" value="${escapeHtml(p.name)}" onchange="updatePersonName('${p.id}', this.value)" class="flex-1 border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm">
    <button onclick="removePerson('${p.id}')" class="w-8 h-8 flex-shrink-0 rounded-lg bg-red-50 text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>
  </div>`).join('');

  const mySel = document.getElementById('myProfileSelect');
  mySel.innerHTML = '<option value="">-- select --</option>' + personOptions(localDeviceProfileId);

  const vapidInput = document.getElementById('fcmVapidKeyInput');
  if (vapidInput) vapidInput.value = state.settings.vapidKey || '';

  const weekStartSel = document.getElementById('weekStartSelect');
  if (weekStartSel) weekStartSel.value = state.settings.weekStart || 'sunday';
  const quotaInput = document.getElementById('weeklyQuotaInput');
  if (quotaInput) quotaInput.value = state.settings.weeklyQuota != null ? state.settings.weeklyQuota : 2;

  const notifStatus = document.getElementById('notifPermStatus');
  if ('Notification' in window) {
    notifStatus.textContent = 'Notification permission: ' + Notification.permission;
  } else {
    notifStatus.textContent = 'Notifications not supported in this browser.';
  }

  const verDisplay = document.getElementById('appVersionDisplay');
  if (verDisplay) verDisplay.textContent = APP_VERSION;
  const verBadge = document.getElementById('appVersionBadge');
  if (verBadge) verBadge.textContent = APP_VERSION;
}

function addPersonRow() {
  const usedColors = state.people.map(p => p.color);
  const nextColor = DEFAULT_COLORS.find(c => !usedColors.includes(c.hex)) || DEFAULT_COLORS[state.people.length % 5];
  state.people.push({ id: uid('p'), name: 'New Person', color: nextColor.hex });
  saveState(); renderProfiles();
}
function updatePersonName(id, val) { getPerson(id).name = val; saveState(); renderProfiles(); }
function updatePersonColor(id, val) { getPerson(id).color = val; saveState(); renderProfiles(); }
function removePerson(id) {
  if (!confirm('Remove this person? Their assigned chores will stay but show as unassigned.')) return;
  state.people = state.people.filter(p => p.id !== id);
  saveState(); renderProfiles();
}

function setMyProfile(id) { 
  localDeviceProfileId = id || null;
  localStorage.setItem('chores_local_profile_id', localDeviceProfileId || '');
  renderApp(); 
  toast('Profile selected for this device', 'fa-check'); 
  registerDeviceToken();
}

function saveVapidKey(val) {
  state.settings.vapidKey = val.trim();
  saveState();
  toast('VAPID key saved', 'fa-key');
}
function setWeekStart(val) { state.settings.weekStart = val; saveState(); toast('Calendar updated', 'fa-calendar-days'); }
function setWeeklyQuota(val) { state.settings.weeklyQuota = Math.max(0, Number(val||0)); saveState(); }

/* =========================== PUSH NOTIFICATIONS (FCM) =========================== */
async function requestPushNotificationPermission() {
  if (!('Notification' in window)) { toast('Notifications not supported here', 'fa-triangle-exclamation'); return; }
  const perm = await Notification.requestPermission();
  renderProfiles();
  if (perm === 'granted') {
    toast('Notifications permitted! Registering FCM token...', 'fa-bell');
    await registerDeviceToken();
  } else {
    toast('Permission denied', 'fa-triangle-exclamation');
  }
}

async function registerDeviceToken() {
  if (!fcmMessaging || !localDeviceProfileId) return;
  try {
    const swReg = await navigator.serviceWorker.ready;
    const vapidKey = state.settings.vapidKey;
    const token = await fcmMessaging.getToken({
      vapidKey: vapidKey || undefined,
      serviceWorkerRegistration: swReg
    });
    if (token) {
      state.deviceTokens = state.deviceTokens || {};
      state.deviceTokens[localDeviceProfileId] = token;
      saveState();
      toast('Device push token registered!', 'fa-shield-halved');
    }
  } catch (err) {
    console.error('FCM Token registration error:', err);
  }
}

/* =========================== POKES =========================== */
function openPokeModal(presetTarget) {
  document.getElementById('pokeTarget').innerHTML = personOptions(presetTarget);
  renderPokeHistory();
  openModal('pokeModal');
}
function sendPoke() {
  const toId = document.getElementById('pokeTarget').value;
  const message = document.getElementById('pokeMessage').value.trim() || 'Poke!';
  const poke = { id: uid('poke'), fromPersonId: localDeviceProfileId, toPersonId: toId, message, ts: Date.now(), read: false };
  state.pokes.unshift(poke);
  if (state.pokes.length > 100) state.pokes.length = 100;
  saveState();
  closeModal('pokeModal');
  toast('Poke sent to '+((getPerson(toId)||{}).name||'them'), 'fa-bell');
  maybeShowLocalNotification(poke);
}
function renderPokeHistory() {
  const box = document.getElementById('pokeHistory');
  const recent = state.pokes.slice(0, 3);
  box.innerHTML = recent.length ? '<div class="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Recent Pokes</div>' + recent.map(p => `<div class="text-xs text-gray-600 flex items-center gap-1.5">
    <i class="fa-solid fa-bell text-purple-400 text-[10px]"></i>
    <span>${personChip(p.fromPersonId)} → ${personChip(p.toPersonId)}</span>
    <span class="text-gray-400 ml-auto">${new Date(p.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>
  </div>`).join('') : '';
}
function maybeShowLocalNotification(poke) {
  if ('Notification' in window && Notification.permission === 'granted' && poke.toPersonId === localDeviceProfileId) {
    new Notification('Poke from '+((getPerson(poke.fromPersonId)||{}).name||'Family'), { body: poke.message, icon: 'icon-192.png' });
  }
}
let lastSeenPokeCount = 0;
function checkForNewPokesTargetingMe() {
  if (!localDeviceProfileId) return;
  const mine = state.pokes.filter(p => p.toPersonId === localDeviceProfileId);
  if (mine.length > lastSeenPokeCount) {
    const newest = mine[0];
    if (newest && Date.now() - newest.ts < 60000) maybeShowLocalNotification(newest);
  }
  lastSeenPokeCount = mine.length;
}

/* =========================== CLOUD SYNC =========================== */
function parseConfigInput(raw) {
  try {
    return JSON.parse(raw);
  } catch(e) {
    try {
      return (new Function("return " + raw))();
    } catch(err) {
      return null;
    }
  }
}

function loadSyncConfigFromStorage() {
  try { const raw = localStorage.getItem('chores_sync_config'); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
function applySyncConfig(cfg) {
  try {
    if (typeof firebase === 'undefined') return false;
    firebaseApp = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(cfg.fbConfig);
    firestoreDb = firebase.firestore();
    if (firebase.messaging && firebase.messaging.isSupported()) {
      fcmMessaging = firebase.messaging();
      fcmMessaging.onMessage((payload) => {
        const title = payload.notification?.title || 'Family Chores';
        const body = payload.notification?.body || '';
        toast(title + ': ' + body, 'fa-bell');
      });
    }
    return true;
  } catch(e) { console.error('Sync config failed', e); return false; }
}
async function enableCloudSync() {
  const raw = document.getElementById('syncConfigInput').value.trim();
  if (!raw) { toast('Paste a Firebase config first', 'fa-triangle-exclamation'); return; }
  
  const fbConfig = parseConfigInput(raw);
  if (!fbConfig) { toast("That JSON didn't parse — check formatting", 'fa-triangle-exclamation'); return; }
  
  const cfg = { fbConfig, docId: 'family-chores-shared' };
  localStorage.setItem('chores_sync_config', JSON.stringify(cfg));
  if (applySyncConfig(cfg)) {
    document.getElementById('syncStatusLine').textContent = 'Connected. Pulling latest data...';
    await pullFromCloud();
    listenForCloudChanges();
    registerDeviceToken();
    toast('Cloud sync enabled', 'fa-cloud');
  } else {
    document.getElementById('syncStatusLine').textContent = 'Could not connect — check the config.';
  }
}
async function pushToCloud() {
  if (!firestoreDb) return;
  try {
    const doc = await firestoreDb.collection('chores_sync').doc('family-chores-shared').get();
    let mergedTokens = { ...(state.deviceTokens || {}) };
    if (doc.exists && doc.data().data) {
      const remote = JSON.parse(doc.data().data);
      mergedTokens = { ...(remote.deviceTokens || {}), ...mergedTokens };
    }
    state.deviceTokens = mergedTokens;

    await firestoreDb.collection('chores_sync').doc('family-chores-shared').set({
      data: JSON.stringify(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.error('push failed', e); }
}
async function pullFromCloud() {
  if (!firestoreDb) return;
  try {
    const doc = await firestoreDb.collection('chores_sync').doc('family-chores-shared').get();
    if (doc.exists && doc.data().data) {
      const remote = JSON.parse(doc.data().data);
      state = Object.assign(state, remote);
      persist();
      renderApp();
      checkForNewPokesTargetingMe();
    }
  } catch(e) { console.error('pull failed', e); }
}
function listenForCloudChanges() {
  if (!firestoreDb || unsubscribeSync) return;
  unsubscribeSync = firestoreDb.collection('chores_sync').doc('family-chores-shared')
    .onSnapshot(doc => {
      if (doc.exists && doc.data().data) {
        const remote = JSON.parse(doc.data().data);
        state = Object.assign(state, remote);
        persist();
        renderApp();
        checkForNewPokesTargetingMe();
      }
    });
}
function manualSyncNow() { if (firestoreDb) { pullFromCloud(); toast('Synced', 'fa-rotate'); } else { toast('Enable cloud sync first', 'fa-triangle-exclamation'); } }
function initSyncOnBoot() {
  const cfg = loadSyncConfigFromStorage();
  if (cfg && applySyncConfig(cfg)) {
    document.getElementById('syncConfigInput').value = JSON.stringify(cfg.fbConfig, null, 2);
    pullFromCloud().then(() => {
      listenForCloudChanges();
      registerDeviceToken();
    });
  }
}

/* =========================== EXPORT / IMPORT =========================== */
function exportDataJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'family-chores-export-' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(url);
}
function importDataJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const imported = JSON.parse(evt.target.result);
      if (!confirm('This will replace all current data with the imported file. Continue?')) return;
      state = Object.assign(state, imported);
      saveState(); renderProfiles();
      toast('Data imported', 'fa-check');
    } catch(err) { toast('Could not read that file', 'fa-triangle-exclamation'); }
  };
  reader.readAsText(file);
}

/* =========================== DARK MODE =========================== */
function toggleDarkMode() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('chores_dark_mode', isDark ? '1' : '0');
}

/* =========================== MASTER RENDER =========================== */
function renderApp() {
  renderHeader();
  renderCalendar();
  renderSelectedDay();
  renderProfiles();
  renderMarketplaceBannerOnly();
  const activeTab = ['calendar','market','log','stats','honeydo'].find(t => {
    const nav = document.getElementById('nav-'+t);
    return nav && nav.className.includes('font-bold');
  }) || 'calendar';
  if (activeTab === 'market') renderMarketplace();
  if (activeTab === 'log') renderLog();
  if (activeTab === 'stats') renderStats();
  if (activeTab === 'honeydo') renderHoneyDo();
}
function renderMarketplaceBannerOnly() {
  const banner = document.getElementById('marketBannerCount');
  if (!banner) return;
  const open = activeMarketInstances().filter(x => !x.claim);
  banner.textContent = open.length + (open.length===1?' open':' open');
}

/* =========================== BOOT =========================== */
window.onload = async function() {
  await loadState();
  renderApp();
  initSyncOnBoot();
  const lastTab = localStorage.getItem('chores_last_tab');
  if (lastTab) switchTab(lastTab);
  setInterval(checkForNewPokesTargetingMe, 15000);
};

if ('serviceWorker' in navigator) {
  let refreshingOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshingOnce) return;
    refreshingOnce = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
    }).catch(err => console.error('SW registration failed', err));
  });
}
