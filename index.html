<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Chores</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  try { if (localStorage.getItem('chores_dark_mode') === '1') document.documentElement.classList.add('dark'); } catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#F4F5F7; color:#1F2937; -webkit-font-smoothing:antialiased; }
  .font-mono { font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }

  html.dark { color-scheme: dark; }
  html.dark body { background-color:#0f172a; color:#e2e8f0; }
  html.dark .bg-white { background-color:#1e293b; }
  html.dark .bg-gray-50 { background-color:#172033; }
  html.dark .bg-gray-100 { background-color:#1e293b; }
  html.dark .bg-gray-200 { background-color:#334155; }
  html.dark .border-gray-100 { border-color:#1e293b; }
  html.dark .border-gray-200 { border-color:#334155; }
  html.dark .border-gray-300 { border-color:#475569; }
  html.dark .text-gray-900 { color:#f1f5f9; }
  html.dark .text-gray-800 { color:#e2e8f0; }
  html.dark .text-gray-700 { color:#cbd5e1; }
  html.dark .text-gray-600 { color:#94a3b8; }
  html.dark .text-gray-500 { color:#94a3b8; }
  html.dark .text-gray-400 { color:#64748b; }
  html.dark ::-webkit-scrollbar { background:#0f172a; }
  html.dark ::-webkit-scrollbar-thumb { background:#334155; border-radius:4px; }

  .shadow-sm { box-shadow:0 1px 2px rgba(15,23,42,0.04),0 3px 10px rgba(15,23,42,0.05) !important; }
  .shadow-md { box-shadow:0 2px 6px rgba(15,23,42,0.06),0 6px 16px rgba(15,23,42,0.07) !important; }
  .shadow-lg { box-shadow:0 4px 10px rgba(15,23,42,0.07),0 10px 28px rgba(15,23,42,0.10) !important; }
  .rounded-xl { border-radius:14px !important; }
  .rounded-2xl { border-radius:18px !important; }
  .rounded-lg { border-radius:10px !important; }
  button, .transition-all { transition:all .15s ease; }
  button:active { transform:scale(0.97); }

  .person-dot { width:9px; height:9px; border-radius:9999px; display:inline-block; flex-shrink:0; }
  .person-chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:700; }
  .chore-card { border-left-width:4px; }
  .subtask-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(0,0,0,0.05); }
  html.dark .subtask-row { border-bottom-color:rgba(255,255,255,0.06); }
  .subtask-row:last-child { border-bottom:none; }
  .chk { width:18px; height:18px; flex-shrink:0; accent-color:#7C3AED; }
  
  .day-cell { min-height:56px; }
  .day-bar { height:4px; border-radius:2px; width:100%; transition:all .2s ease; }
  
  .modal-backdrop { backdrop-filter:blur(2px); }
  .fade-in { animation: fadeIn .15s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="min-h-screen pb-24 text-gray-800 bg-gray-100">

<!-- Header -->
<header class="px-4 py-3 border-b border-gray-200 bg-gradient-to-r from-white to-purple-50/40 sticky top-0 z-30 shadow-sm max-w-md mx-auto">
  <div class="flex justify-between items-center mb-2">
    <div>
      <div class="text-[9px] text-gray-500 font-mono font-bold tracking-wider uppercase">Family Chores</div>
      <div class="text-lg font-bold text-gray-900" id="headerMonthLabel">--</div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openPokeModal()" title="Poke someone" class="w-9 h-9 rounded-full bg-white border border-purple-200 flex items-center justify-center text-purple-600 hover:bg-purple-500 hover:text-white shadow-sm">
        <i class="fa-solid fa-bell"></i>
      </button>
      <button onclick="openModal('profilesModal')" title="Profiles & Settings" class="w-9 h-9 rounded-full bg-white border border-purple-200 flex items-center justify-center text-purple-600 hover:bg-purple-500 hover:text-white shadow-sm">
        <i class="fa-solid fa-users"></i>
      </button>
    </div>
  </div>

  <!-- Yearly Chore banner -->
  <div id="yearlyChoreBanner" onclick="openYearlyChoreModal()" class="cursor-pointer rounded-xl text-white px-3.5 py-2.5 flex items-center justify-between shadow-md">
    <div class="min-w-0">
      <div class="text-[9px] font-bold uppercase tracking-wider opacity-90">This Month's Family Chore</div>
      <div id="yearlyChoreTitle" class="text-sm font-bold truncate">--</div>
    </div>
    <div class="text-right flex items-center gap-2 flex-shrink-0">
      <div id="yearlyChoreProgress" class="text-xs font-mono font-bold">0/0</div>
      <i class="fa-solid fa-chevron-right text-xs opacity-80"></i>
    </div>
  </div>

  <!-- Marketplace quick banner -->
  <div id="marketBanner" onclick="switchTab('market')" class="cursor-pointer mt-2 rounded-xl bg-gradient-to-r from-amber-400 to-pink-500 text-white px-3.5 py-2 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2 min-w-0">
      <i class="fa-solid fa-store text-sm"></i>
      <div class="text-xs font-bold truncate">Chore Marketplace</div>
    </div>
    <div class="text-right flex items-center gap-2 flex-shrink-0">
      <div id="marketBannerCount" class="text-xs font-mono font-bold">0 open</div>
      <i class="fa-solid fa-chevron-right text-xs opacity-80"></i>
    </div>
  </div>
</header>

<main class="max-w-md mx-auto px-4 pt-3">

  <!-- TAB: Chore Calendar -->
  <section id="tab-calendar" class="space-y-3">
    <div class="bg-white rounded-2xl shadow-sm p-2.5 flex items-center gap-1.5 overflow-x-auto" id="calendarFilterBar"></div>

    <div class="bg-gradient-to-br from-white to-purple-50/30 rounded-2xl shadow-sm p-3.5">
      <div class="flex items-center justify-between mb-3">
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="calMonthLabel" class="font-bold text-base text-gray-900"></div>
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div id="calWeekdayHeader" class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-gray-400 mb-1.5"></div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
    </div>

    <div class="bg-gradient-to-br from-white to-purple-50/40 rounded-2xl shadow-sm p-3">
      <div class="flex items-center justify-between mb-2">
        <div class="font-bold text-sm" id="selectedDayLabel">Today</div>
        <button onclick="openChoreModal(null, selectedDate)" class="text-xs font-bold text-purple-600 flex items-center gap-1"><i class="fa-solid fa-plus"></i> Add</button>
      </div>
      <div id="selectedDayList" class="space-y-2"></div>
    </div>
  </section>

  <!-- TAB: Chore Log -->
  <section id="tab-log" class="hidden space-y-3">
    <div class="bg-gradient-to-br from-white to-blue-50/40 rounded-2xl shadow-sm p-3">
      <div class="flex items-center justify-between mb-2 gap-2">
        <select id="logPersonFilter" onchange="renderLog()" class="text-xs font-semibold border border-gray-200 rounded-lg px-2 py-1.5 flex-1 bg-white">
          <option value="all">Everyone</option>
        </select>
        <button onclick="openChoreModal()" class="text-xs font-bold bg-blue-500 text-white rounded-lg px-3 py-1.5 flex items-center gap-1"><i class="fa-solid fa-plus"></i> Add</button>
      </div>
      
      <!-- Filter controls for Chore Log -->
      <div class="grid grid-cols-2 gap-2 mb-2">
        <select id="logStatusFilter" onchange="renderLog()" class="text-xs font-semibold border border-gray-200 rounded-lg px-2 py-1.5 bg-white">
          <option value="all">All Statuses</option>
          <option value="completed">Completed Only</option>
          <option value="pending">Pending Only</option>
        </select>
        <select id="logRangeFilter" onchange="renderLog()" class="text-xs font-semibold border border-gray-200 rounded-lg px-2 py-1.5 bg-white">
          <option value="all">All Time</option>
          <option value="past7">Past 7 Days</option>
          <option value="next7">Next 7 Days</option>
          <option value="thisMonth">This Month</option>
        </select>
      </div>

      <button onclick="openChoreModal(null, todayStr(), true)" class="w-full text-xs font-bold border-2 border-dashed border-blue-300 text-blue-600 rounded-lg py-2 mb-2">
        <i class="fa-solid fa-bolt"></i> Log an extra chore I already did
      </button>
      <div id="logList" class="space-y-2"></div>
    </div>
  </section>

  <!-- TAB: Family Stats -->
  <section id="tab-stats" class="hidden space-y-3">
    <div class="bg-gradient-to-br from-white to-emerald-50/40 rounded-2xl shadow-sm p-3">
      <div class="flex items-center gap-2 mb-3">
        <select id="statsPeriod" onchange="renderStats()" class="text-xs font-semibold border border-gray-200 rounded-lg px-2 py-1.5 flex-1 bg-white">
          <option value="month">This Month</option>
          <option value="week">This Week</option>
          <option value="30">Last 30 Days</option>
          <option value="year">This Year</option>
        </select>
      </div>
      <div style="height:180px;"><canvas id="statsChart"></canvas></div>
    </div>
    <div id="statsPersonCards" class="space-y-2"></div>
    <div class="bg-gradient-to-br from-white to-amber-50/40 rounded-2xl shadow-sm p-3">
      <div class="font-bold text-sm mb-2"><i class="fa-solid fa-piggy-bank text-purple-500"></i> Reward Bank</div>
      <div id="bankList" class="space-y-2"></div>
    </div>
  </section>

  <!-- TAB: Honey-Do List -->
  <section id="tab-honeydo" class="hidden space-y-3">
    <div class="bg-gradient-to-br from-white to-orange-50/50 rounded-2xl shadow-sm p-3">
      <div class="flex items-center justify-between mb-2">
        <div class="font-bold text-sm">Never-Ending Honey-Do List</div>
        <button onclick="openHoneyDoModal()" class="text-xs font-bold bg-orange-500 text-white rounded-lg px-3 py-1.5 flex items-center gap-1"><i class="fa-solid fa-plus"></i> Add</button>
      </div>
      <div class="text-[11px] text-gray-500 mb-2">Projects & weekend tasks — no due date required.</div>
      <div id="honeyDoList" class="space-y-2"></div>
    </div>
  </section>

  <!-- TAB: Marketplace -->
  <section id="tab-market" class="hidden space-y-3">
    <div class="bg-gradient-to-br from-amber-50 to-pink-50 rounded-2xl shadow-sm p-3">
      <div class="flex items-center justify-between mb-1">
        <div class="font-bold text-sm"><i class="fa-solid fa-store text-pink-500"></i> Open Chores</div>
        <button onclick="openMarketModal()" class="text-xs font-bold bg-pink-500 text-white rounded-lg px-3 py-1.5 flex items-center gap-1"><i class="fa-solid fa-plus"></i> Post</button>
      </div>
      <div class="text-[11px] text-gray-500">First come, first served. Claim one and pick when you'll get it done.</div>
    </div>
    <div id="marketQuotaCards" class="grid grid-cols-2 gap-2"></div>
    <div class="bg-white rounded-2xl shadow-sm p-3">
      <div class="font-bold text-xs text-gray-500 uppercase tracking-wide mb-2">Up for grabs</div>
      <div id="marketOpenList" class="space-y-2"></div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-3">
      <div class="font-bold text-xs text-gray-500 uppercase tracking-wide mb-2">Claimed this week</div>
      <div id="marketClaimedList" class="space-y-2"></div>
    </div>
  </section>

</main>

<!-- Bottom Nav -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 max-w-md mx-auto flex justify-around items-center py-2 z-30 shadow-lg">
  <button id="nav-calendar" onclick="switchTab('calendar')" class="flex flex-col items-center gap-1 text-purple-600 font-bold bg-purple-50 rounded-2xl px-2.5 py-1.5 -my-1">
    <i class="fa-solid fa-calendar-days"></i><span class="text-[9px]">Calendar</span>
  </button>
  <button id="nav-market" onclick="switchTab('market')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 px-2.5 py-1.5 -my-1">
    <i class="fa-solid fa-store"></i><span class="text-[9px]">Market</span>
  </button>
  <button id="nav-log" onclick="switchTab('log')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 px-2.5 py-1.5 -my-1">
    <i class="fa-solid fa-list-check"></i><span class="text-[9px]">Chore Log</span>
  </button>
  <button id="nav-stats" onclick="switchTab('stats')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 px-2.5 py-1.5 -my-1">
    <i class="fa-solid fa-chart-simple"></i><span class="text-[9px]">Stats</span>
  </button>
  <button id="nav-honeydo" onclick="switchTab('honeydo')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 px-2.5 py-1.5 -my-1">
    <i class="fa-solid fa-house-chimney"></i><span class="text-[9px]">Honey-Do</span>
  </button>
</nav>

<!-- ============ MODALS ============ -->

<!-- Day Chore Detail / Expand Modal -->
<div id="choreDetailModal" class="hidden fixed inset-0 bg-black/40 modal-backdrop z-50 flex items-end sm:items-center justify-center">
  <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[85vh] overflow-y-auto fade-in">
    <div class="flex justify-between items-start mb-2">
      <div class="min-w-0">
        <div id="cdTitle" class="text-lg font-bold text-gray-900"></div>
        <div id="cdMeta" class="text-xs text-gray-500 mt-0.5"></div>
      </div>
      <button onclick="closeModal('choreDetailModal')" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cdRewardBox" class="rounded-xl p-2.5 mb-3 text-sm hidden"></div>
    <div id="cdSubtasks" class="mb-3"></div>
    <div id="cdNotes" class="text-xs text-gray-500 mb-3 hidden"></div>
    <div class="flex gap-2">
      <button id="cdCompleteBtn" onclick="toggleChoreComplete()" class="flex-1 rounded-xl py-2.5 font-bold text-sm text-white bg-emerald-600"><i class="fa-solid fa-check"></i> Mark Complete</button>
      <button id="cdPokeBtn" onclick="pokeFromChore()" class="rounded-xl py-2.5 px-3 font-bold text-sm bg-purple-50 text-purple-600 border border-purple-200"><i class="fa-solid fa-bell"></i></button>
      <button id="cdEditBtn" onclick="editCurrentChore()" class="rounded-xl py-2.5 px-3 font-bold text-sm bg-gray-100 text-gray-600"><i class="fa-solid fa-pen"></i></button>
      <button id="cdDeleteBtn" onclick="deleteCurrentChore()" class="rounded-xl py-2.5 px-3 font-bold text-sm bg-red-50 text-red-600"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>
</div>

<!-- Add/Edit Chore / Task Modal -->
<div id="choreModal" class="hidden fixed inset-0 bg-black/40 modal-backdrop z-50 flex items-end sm:items-center justify-center">
  <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[90vh] overflow-y-auto fade-in">
    <div class="flex justify-between items-center mb-3">
      <div id="choreModalTitle" class="text-lg font-bold">Add Item</div>
      <button onclick="closeModal('choreModal')" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Mode Selector: Family Chore vs Personal Task -->
    <div class="flex gap-2 bg-gray-100 p-1 rounded-xl mb-3">
      <button type="button" id="itemTypeChoreBtn" onclick="setItemType('chore')" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white shadow-sm text-purple-700">Family Chore</button>
      <button type="button" id="itemTypeTaskBtn" onclick="setItemType('task')" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-500">Personal Task</button>
    </div>

    <input type="hidden" id="choreId">
    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold text-gray-500" id="itemTitleLabel">Chore Name</label>
        <input id="choreTitle" type="text" placeholder="Feed the dogs" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1">
      </div>
      <div>
        <label class="text-xs font-bold text-gray-500" id="itemPersonLabel">Assign To</label>
        <select id="chorePerson" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1"></select>
      </div>

      <!-- Repeat Mode Selector -->
      <div class="flex gap-2">
        <button type="button" onclick="setChoreRepeatMode('single')" id="repeatModeSingleBtn" class="flex-1 rounded-lg py-2 text-xs font-bold border">Single</button>
        <button type="button" onclick="setChoreRepeatMode('recurring')" id="repeatModeRecurBtn" class="flex-1 rounded-lg py-2 text-xs font-bold border">Recurring</button>
      </div>

      <div id="singleDateBox" class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-bold text-gray-500">Due Date</label>
          <input id="choreDate" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500">Due Time <span class="font-normal">(optional)</span></label>
          <input id="choreTime" type="time" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>
      </div>

      <div id="recurBox" class="hidden space-y-2 bg-gray-50 rounded-lg p-2.5">
        <label class="text-xs font-bold text-gray-500">Repeats</label>
        <select id="recurFreq" onchange="updateRecurUI()" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
          <option value="rotation" id="recurRotationOption">Rotating (alternating chores)</option>
        </select>

        <div id="recurIntervalBox" class="hidden">
          <label class="text-xs font-bold text-gray-500">Every <span id="recurIntervalUnitLabel">week(s)</span></label>
          <input id="recurInterval" type="number" min="1" max="52" value="1" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>

        <div id="recurWeeklyBox" class="hidden">
          <label class="text-xs font-bold text-gray-500">Days</label>
          <div class="grid grid-cols-7 gap-1 mt-1" id="recurDaysGrid"></div>
        </div>
        <div id="recurMonthlyBox" class="hidden">
          <label class="text-xs font-bold text-gray-500">Day of Month</label>
          <input id="recurDayOfMonth" type="number" min="1" max="31" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-1">
        </div>

        <div id="recurRotationBox" class="hidden">
          <label class="text-xs font-bold text-gray-500">Rotating shifts</label>
<script>
/* =========================== STATE & APP VERSION =========================== */
const APP_VERSION = "v6.1.1";

const DEFAULT_COLORS = [
  {name:'Green', hex:'#10B981'},
  {name:'Orange', hex:'#F97316'},
  {name:'Blue', hex:'#3B82F6'},
  {name:'Pink', hex:'#EC4899'},
  {name:'Purple', hex:'#8B5CF6'},
  {name:'Teal', hex:'#14B8A6'},
  {name:'Amber', hex:'#F59E0B'},
  {name:'Rose', hex:'#F43F5E'},
  {name:'Indigo', hex:'#6366F1'},
  {name:'Lime', hex:'#84CC16'}
];
const WEEKDAY_LABELS_SUN = ['S','M','T','W','T','F','S'];
const WEEKDAY_LABELS_MON = ['M','T','W','T','F','S','S'];
const WEEKDAY_LABELS = WEEKDAY_LABELS_SUN;
const MONTH_GRADIENTS = [
  ['#8B5CF6','#EC4899'],
  ['#EC4899','#F97316'],
  ['#F97316','#F59E0B'],
  ['#22C55E','#14B8A6'],
  ['#14B8A6','#3B82F6'],
  ['#F59E0B','#EF4444'],
  ['#3B82F6','#6366F1'],
  ['#F43F5E','#F59E0B'],
  ['#84CC16','#14B8A6'],
  ['#F97316','#F43F5E'],
  ['#6366F1','#8B5CF6'],
  ['#EF4444','#8B5CF6']
];
const NAV_COLORS = { calendar:'purple', market:'pink', log:'blue', stats:'emerald', honeydo:'orange' };

let state = {
  people: [],
  chores: [],
  recurring: [],
  recurringCompletions: {},
  yearlyChores: [],
  yearlyCompletions: {},
  honeyDo: [],
  bankedRewards: [],
  pokes: [],
  deviceTokens: {},
  marketChores: [],
  marketClaims: {},
  marketCompletions: [],
  settings: { weekStart: 'sunday', weeklyQuota: 2, vapidKey: '' }
};

let localDeviceProfileId = localStorage.getItem('chores_local_profile_id') || null;

let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedDate = todayStr();
let dayListDate = null;
let currentChoreDetail = null;
let subtaskBuilderCount = 0;
let marketSubtaskBuilderCount = 0;
let rotationStageCount = 0;
let currentItemType = 'chore';
let calendarFilter = new Set();
let firestoreDb = null, firebaseApp = null, fcmMessaging = null, unsubscribeSync = null;

function todayStr() { return formatLocalDate(new Date()); }
function formatLocalDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseLocalDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function uid(prefix) { return prefix+'-'+Date.now()+'-'+Math.floor(Math.random()*10000); }

/* =========================== FORCE UPDATE ENGINE =========================== */
async function forceAppUpdate() {
  toast("Updating app and refreshing cache...", "fa-rotate");
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (let reg of registrations) {
        await reg.unregister();
      }
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      for (let key of keys) {
        await caches.delete(key);
      }
    }
  } catch (e) {
    console.error("Cache purge error:", e);
  }
  setTimeout(() => {
    window.location.href = window.location.origin + window.location.pathname + '?update=' + Date.now();
  }, 400);
}

/* =========================== PERSIST =========================== */
function saveState() { 
  persist(); 
  if (firestoreDb) pushToCloud(); 
  renderApp(); 
}

function persist() { 
  try { 
    localStorage.setItem('chores_state', JSON.stringify(state)); 
    localStorage.setItem('chores_local_profile_id', localDeviceProfileId || '');
  } catch(e){ console.error(e); } 
}

async function loadState() {
  try {
    const raw = localStorage.getItem('chores_state');
    localDeviceProfileId = localStorage.getItem('chores_local_profile_id') || null;
    if (raw) {
      const loaded = JSON.parse(raw);
      state = Object.assign(state, loaded);
    } else {
      seedDefaultData();
    }
  } catch(e) { console.error(e); seedDefaultData(); }
}

function seedDefaultData() {
  state.people = DEFAULT_COLORS.slice(0,4).map((c,i) => ({ id: uid('p'), name: i===0?'Jarred':i===1?'Jaclyn':i===2?'Jiana':'Juliette', color: c.hex }));
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  state.yearlyChores = monthNames.map((m,i) => ({ id: uid('yc'), month: i+1, title: m+' Family Chore', subtasks: [] }));
}

/* =========================== RECURRING ENGINE =========================== */
function getWeekStartSetting() { return (state.settings && state.settings.weekStart) || 'sunday'; }
function startOfWeek(dateStr, weekStart) {
  const d = parseLocalDate(dateStr);
  const dow = d.getDay();
  const diff = (weekStart||getWeekStartSetting()) === 'monday' ? ((dow + 6) % 7) : dow;
  d.setDate(d.getDate() - diff);
  return d;
}
function weekDiff(startDateStr, dateStr, weekStart) {
  const a = startOfWeek(startDateStr, weekStart);
  const b = startOfWeek(dateStr, weekStart);
  return Math.round((b - a) / (7*86400000));
}
function currentWeekStartStr(refDateStr) { return formatLocalDate(startOfWeek(refDateStr || todayStr())); }

function ruleFiresOnDate(rule, dateStr) {
  if (rule.active === false) return false;
  if (dateStr < rule.startDate) return false;
  if (rule.endDate && dateStr > rule.endDate) return false;
  const d = parseLocalDate(dateStr);
  const interval = Math.max(1, Number(rule.interval || 1));
  if (rule.frequency === 'daily') {
    const days = Math.round((d - parseLocalDate(rule.startDate)) / 86400000);
    return days >= 0 && days % interval === 0;
  }
  if (rule.frequency === 'weekly') {
    if (!(rule.daysOfWeek||[]).includes(d.getDay())) return false;
    const w = weekDiff(rule.startDate, dateStr);
    return w >= 0 && w % interval === 0;
  }
  if (rule.frequency === 'monthly') {
    if (d.getDate() !== Number(rule.dayOfMonth || 1)) return false;
    const sd = parseLocalDate(rule.startDate);
    const months = (d.getFullYear()-sd.getFullYear())*12 + (d.getMonth()-sd.getMonth());
    return months >= 0 && months % interval === 0;
  }
  if (rule.frequency === 'yearly') {
    const sd = parseLocalDate(rule.startDate);
    return d.getMonth() === sd.getMonth() && d.getDate() === sd.getDate();
  }
  if (rule.frequency === 'rotation') {
    const w = weekDiff(rule.startDate, dateStr);
    if (w < 0) return false;
    const stages = (rule.rotation && rule.rotation.stages) || [];
    if (!stages.length) return false;
    const stageWeeks = Math.max(1, Number((rule.rotation && rule.rotation.stageWeeks) || 1));
    const stageIdx = Math.floor(w / stageWeeks) % stages.length;
    const stage = stages[stageIdx];
    const days = (stage.daysOfWeek && stage.daysOfWeek.length) ? stage.daysOfWeek : [0,1,2,3,4,5,6];
    return days.includes(d.getDay());
  }
  return false;
}
function ruleTitleForDate(rule, dateStr) {
  if (rule.frequency !== 'rotation') return rule.title;
  const stages = (rule.rotation && rule.rotation.stages) || [];
  if (!stages.length) return rule.title;
  const w = weekDiff(rule.startDate, dateStr);
  const stageWeeks = Math.max(1, Number((rule.rotation && rule.rotation.stageWeeks) || 1));
  const stageIdx = Math.floor(Math.max(0,w) / stageWeeks) % stages.length;
  return stages[stageIdx].title || rule.title;
}
function ruleSubtasksForDate(rule, dateStr) {
  if (rule.frequency !== 'rotation') return rule.subtasks || [];
  const stages = (rule.rotation && rule.rotation.stages) || [];
  if (!stages.length) return rule.subtasks || [];
  const w = weekDiff(rule.startDate, dateStr);
  const stageWeeks = Math.max(1, Number((rule.rotation && rule.rotation.stageWeeks) || 1));
  const stageIdx = Math.floor(Math.max(0,w) / stageWeeks) % stages.length;
  return stages[stageIdx].subtasks || [];
}
function getRecurringForDate(dateStr) {
  return state.recurring.filter(r => ruleFiresOnDate(r, dateStr)).map(r => {
    const key = r.id+'_'+dateStr;
    const comp = state.recurringCompletions[key] || {};
    return {
      kind: 'recurring', id: r.id, dateStr, title: ruleTitleForDate(r, dateStr), personId: r.personId,
      time: r.time, subtasks: ruleSubtasksForDate(r, dateStr), reward: r.reward, isTask: !!r.isTask,
      completed: !!comp.completed, subtaskState: comp.subtaskState || {}
    };
  });
}
function getSingleForDate(dateStr) {
  return state.chores.filter(c => c.date === dateStr).map(c => ({
    kind: 'single', id: c.id, dateStr, title: c.title, personId: c.personId,
    time: c.time, subtasks: c.subtasks || [], reward: c.reward, isTask: !!c.isTask,
    completed: !!c.completed, subtaskState: c.subtaskState || {}, loggedByKid: c.loggedByKid
  }));
}

/* =========================== MARKETPLACE ENGINE =========================== */
function marketClaimKey(marketId, scopeKey) { return marketId+'_'+scopeKey; }
function getMarketClaim(marketId, scopeKey) { return state.marketClaims[marketClaimKey(marketId, scopeKey)]; }
function archiveMarketClaimIfCompleted(marketId, scopeKey) {
  const claim = getMarketClaim(marketId, scopeKey);
  if (!claim || !claim.completed) return;
  const market = state.marketChores.find(m => m.id === marketId);
  if (!market) return;
  const dueDate = resolvedMarketDueDate(market, scopeKey, claim);
  if (!dueDate) return;
  state.marketCompletions.push({ id: uid('mkc'), title: market.title, personId: claim.personId, dueDate, completedAt: claim.completedAt || new Date().toISOString() });
}

function activeMarketInstances(refDateStr) {
  const ref = refDateStr || todayStr();
  const weekStartStr = currentWeekStartStr(ref);
  const out = [];
  state.marketChores.forEach(m => {
    if (m.repeats === 'weekly') {
      const scopeKey = weekStartStr;
      const claim = getMarketClaim(m.id, scopeKey);
      const wsD = parseLocalDate(weekStartStr);
      let windowStart = null, windowEnd = null, dueDate = null;
      if (m.scheduleType === 'flexible') {
        const s = new Date(wsD); s.setDate(s.getDate() + (m.windowStartOffset||0));
        const e = new Date(wsD); e.setDate(e.getDate() + (m.windowEndOffset!=null?m.windowEndOffset:6));
        windowStart = formatLocalDate(s); windowEnd = formatLocalDate(e);
        dueDate = claim ? claim.dueDate : null;
      } else {
        const dd = new Date(wsD); dd.setDate(dd.getDate() + (m.dueDayOffset||0));
        dueDate = formatLocalDate(dd);
      }
      out.push({ market:m, scopeKey, claim, windowStart, windowEnd, dueDate });
    } else {
      const scopeKey = 'once';
      const claim = getMarketClaim(m.id, scopeKey);
      out.push({
        market:m, scopeKey, claim,
        windowStart: m.scheduleType==='flexible' ? m.windowStart : null,
        windowEnd: m.scheduleType==='flexible' ? m.windowEnd : null,
        dueDate: m.scheduleType==='fixed' ? m.dueDate : (claim ? claim.dueDate : null)
      });
    }
  });
  return out;
}
function getMarketForCalendarDate(dateStr) {
  const items = [];
  activeMarketInstances(dateStr).forEach(x => {
    if (x.market.scheduleType === 'fixed') {
      if (x.dueDate === dateStr) {
        items.push({
          kind:'market', id: x.market.id+'::'+x.scopeKey, marketId:x.market.id, scopeKey:x.scopeKey, dateStr,
          title: x.market.title, personId: x.claim ? x.claim.personId : null, time: null,
          subtasks: x.market.subtasks||[], reward: x.market.reward, isTask: false,
          completed: !!(x.claim && x.claim.completed), subtaskState: (x.claim && x.claim.subtaskState) || {},
          unclaimed: !x.claim
        });
      }
    } else if (x.claim && x.claim.dueDate === dateStr) {
      items.push({
        kind:'market', id: x.market.id+'::'+x.scopeKey, marketId:x.market.id, scopeKey:x.scopeKey, dateStr,
        title: x.market.title, personId: x.claim.personId, time: null,
        subtasks: x.market.subtasks||[], reward: x.market.reward, isTask: false,
        completed: !!x.claim.completed, subtaskState: x.claim.subtaskState || {}, unclaimed:false
      });
    }
  });
  return items;
}
function resolvedMarketDueDate(market, scopeKey, claim) {
  if (market.scheduleType === 'fixed') {
    if (market.repeats === 'weekly') {
      const dd = parseLocalDate(scopeKey);
      dd.setDate(dd.getDate() + (market.dueDayOffset||0));
      return formatLocalDate(dd);
    }
    return market.dueDate;
  }
  return claim ? claim.dueDate : null;
}
function allMarketClaimEntries() {
  return Object.keys(state.marketClaims).map(key => {
    const idx = key.indexOf('_');
    const marketId = key.slice(0, idx);
    const scopeKey = key.slice(idx+1);
    const market = state.marketChores.find(m => m.id === marketId);
    if (!market) return null;
    const claim = state.marketClaims[key];
    return { market, scopeKey, claim, dueDate: resolvedMarketDueDate(market, scopeKey, claim) };
  }).filter(Boolean);
}
function weeklyClaimCountForPerson(personId) {
  const weekStartStr = currentWeekStartStr();
  let n = 0;
  state.marketChores.forEach(m => {
    if (m.repeats !== 'weekly') return;
    const claim = getMarketClaim(m.id, weekStartStr);
    if (claim && claim.personId === personId) n++;
  });
  return n;
}

function getChoresForDate(dateStr) {
  let items = [...getSingleForDate(dateStr), ...getRecurringForDate(dateStr), ...getMarketForCalendarDate(dateStr)];
  
  if (calendarFilter.size) {
    items = items.filter(c => {
      if (c.isTask) return calendarFilter.has(c.personId);
      return calendarFilter.has(c.personId) || (!c.personId && calendarFilter.has('__unassigned__'));
    });
  } else {
    items = items.filter(c => !c.isTask);
  }
  return items.sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
}

/* =========================== CALENDAR =========================== */
function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
  renderHeader();
}

function renderCalendarFilterBar() {
  const bar = document.getElementById('calendarFilterBar');
  if (!bar) return;
  const allActive = calendarFilter.size === 0;
  let html = `<button onclick="setCalendarFilter(null)" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border ${allActive?'bg-purple-600 text-white border-purple-600':'bg-white text-gray-500 border-gray-200'}">Everyone</button>`;
  html += state.people.map(p => {
    const active = calendarFilter.has(p.id);
    return `<button onclick="toggleCalendarFilterPerson('${p.id}')" class="flex-shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-full text-[11px] font-bold border" style="${active?`background:${p.color};color:#fff;border-color:${p.color}`:`background:#fff;color:${p.color};border-color:${p.color}55`}">
      <span class="person-dot" style="background:${active?'#fff':p.color}"></span>${escapeHtml(p.name)}
    </button>`;
  }).join('');
  html += `<button onclick="toggleCalendarFilterPerson('__unassigned__')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold border ${calendarFilter.has('__unassigned__')?'bg-gray-600 text-white border-gray-600':'bg-white text-gray-400 border-gray-200'}">Unassigned</button>`;
  bar.innerHTML = html;
}
function setCalendarFilter(x) { calendarFilter = new Set(); renderCalendar(); renderSelectedDay(); renderCalendarFilterBar(); }
function toggleCalendarFilterPerson(id) {
  if (calendarFilter.has(id)) calendarFilter.delete(id); else calendarFilter.add(id);
  renderCalendar(); renderSelectedDay(); renderCalendarFilterBar();
}

function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonthLabel').textContent = monthNames[calMonth]+' '+calYear;
  renderCalendarFilterBar();

  const weekStart = getWeekStartSetting();
  const labels = weekStart === 'monday' ? WEEKDAY_LABELS_MON : WEEKDAY_LABELS_SUN;
  const headerEl = document.getElementById('calWeekdayHeader');
  if (headerEl) headerEl.innerHTML = labels.map(l => `<div>${l}</div>`).join('');

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  const first = new Date(calYear, calMonth, 1);
  const rawOffset = first.getDay();
  const startOffset = weekStart === 'monday' ? ((rawOffset + 6) % 7) : rawOffset;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  for (let i=0;i<startOffset;i++) grid.appendChild(document.createElement('div'));

  for (let day=1; day<=daysInMonth; day++) {
    const dateStr = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const chores = getChoresForDate(dateStr);
    const cell = document.createElement('div');
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === selectedDate;
    cell.className = 'day-cell rounded-xl flex flex-col items-center justify-between p-1 cursor-pointer text-xs transition-all '
      + (isSelected ? 'bg-purple-100 font-bold text-purple-700 shadow-inner' : isToday ? 'bg-purple-50 font-bold text-purple-600 border border-purple-200' : 'hover:bg-gray-50 text-gray-700 bg-white border border-gray-100');
    
    const barsHtml = chores.slice(0,3).map(c => {
      const p = getPerson(c.personId);
      const color = c.unclaimed ? '#9CA3AF' : (p ? p.color : '#cbd5e1');
      return `<div class="day-bar" style="background:${color};opacity:${c.completed?0.3:1};${c.unclaimed?'border:1px dashed #6B7280':''}"></div>`;
    }).join('');
    
    const extraCount = chores.length > 3 ? `<div class="text-[8px] font-bold text-gray-400 leading-none">+${chores.length-3}</div>` : '';

    cell.innerHTML = `
      <div class="text-xs font-semibold">${day}</div>
      <div class="w-full space-y-1 px-1 flex flex-col items-center mb-0.5">
        ${barsHtml}
        ${extraCount}
      </div>`;
    cell.onclick = () => { selectedDate = dateStr; openDayList(dateStr); renderCalendar(); renderSelectedDay(); };
    grid.appendChild(cell);
  }
}

function renderSelectedDay() {
  const d = parseLocalDate(selectedDate);
  const label = selectedDate === todayStr() ? 'Today · ' : '';
  document.getElementById('selectedDayLabel').textContent = label + d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
  const list = document.getElementById('selectedDayList');
  const chores = getChoresForDate(selectedDate);
  if (!chores.length) { list.innerHTML = '<div class="text-xs text-gray-400 py-3 text-center">No items for this day 🎉</div>'; return; }
  list.innerHTML = chores.map(choreRowHtml).join('');
}

function choreRowHtml(c) {
  const p = getPerson(c.personId);
  const subCount = (c.subtasks||[]).length;
  const subDone = subCount ? (c.subtasks||[]).filter(s => c.subtaskState && c.subtaskState[s.id]).length : 0;
  const isUnclaimed = c.kind === 'market' && c.unclaimed;
  const borderColor = isUnclaimed ? '#9CA3AF' : (p?p.color:'#cbd5e1');
  const clickable = c.id != null && c.dateStr != null;
  return `<div ${clickable?`onclick="openChoreDetail('${c.kind}','${c.id}','${c.dateStr}')"`:''} class="chore-card ${isUnclaimed?'bg-gray-50/70 border-dashed':'bg-gray-50'} rounded-xl px-3 py-2.5 flex items-center justify-between ${clickable?'cursor-pointer':''}" style="border-left-color:${borderColor};${isUnclaimed?'border-left-style:dashed;border-left-width:4px':''}">
    <div class="min-w-0 flex-1">
      <div class="text-sm font-semibold ${c.completed?'line-through text-gray-400':'text-gray-800'} truncate">
        ${c.isTask ? '<i class="fa-solid fa-user-check text-purple-400 text-[11px] mr-1.5" title="Personal Task"></i>' : ''}
        ${c.kind==='market'?'<i class="fa-solid fa-store text-pink-400 text-[10px] mr-1"></i>':''}
        ${escapeHtml(c.title)}
      </div>
      <div class="flex items-center gap-1.5 mt-1 flex-wrap">
        ${isUnclaimed ? '<span class="person-chip bg-gray-200 text-gray-500">Unassigned · Up for grabs</span>' : personChip(c.personId, c.isTask)}
        ${c.time ? `<span class="text-[10px] text-gray-400 font-mono">${formatTime(c.time)}</span>` : ''}
        ${subCount ? `<span class="text-[10px] text-gray-400">${subDone}/${subCount} steps</span>` : ''}
        ${c.reward && c.reward.enabled ? `<span class="text-[10px] font-bold text-purple-500">${rewardLabel(c.reward)}</span>` : ''}
        ${c.dateStr ? `<span class="text-[10px] text-gray-400 font-mono">${c.dateStr}</span>` : ''}
      </div>
    </div>
    <i class="fa-solid ${isUnclaimed?'fa-hand text-pink-400':(c.completed?'fa-circle-check text-emerald-500':'fa-chevron-right text-gray-300')} text-sm flex-shrink-0 ml-2"></i>
  </div>`;
}
function formatTime(t) { if (!t) return ''; const [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; const h12 = h%12===0?12:h%12; return h12+':'+String(m).padStart(2,'0')+ap; }
function rewardLabel(r) { if (!r || !r.enabled) return ''; if (r.type==='money') return '$'+Number(r.amount||0).toFixed(2)+(r.banked?' (banked)':''); return (r.description||'Reward')+(r.banked?' (banked)':''); }

function openDayList(dateStr) {
  dayListDate = dateStr;
  const d = parseLocalDate(dateStr);
  document.getElementById('dayListTitle').textContent = d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
  const chores = getChoresForDate(dateStr);
  document.getElementById('dayListItems').innerHTML = chores.length ? chores.map(choreRowHtml).join('') : '<div class="text-xs text-gray-400 py-3 text-center">No items this day 🎉</div>';
  openModal('dayListModal');
}

/* =========================== CHORE DETAIL / EXPAND =========================== */
function openChoreDetail(kind, id, dateStr) {
  closeModal('dayListModal');
  currentChoreDetail = { kind, id, dateStr };
  let c, comp, isUnclaimed = false;
  if (kind === 'single') {
    c = state.chores.find(x => x.id === id);
    comp = { completed: c.completed, subtaskState: c.subtaskState||{} };
  } else if (kind === 'recurring') {
    c = state.recurring.find(x => x.id === id);
    c = { ...c, title: ruleTitleForDate(c, dateStr), subtasks: ruleSubtasksForDate(c, dateStr) };
    comp = state.recurringCompletions[id+'_'+dateStr] || {completed:false, subtaskState:{}};
  } else if (kind === 'market') {
    const [marketId, scopeKey] = id.split('::');
    const m = state.marketChores.find(x => x.id === marketId);
    const claim = getMarketClaim(marketId, scopeKey);
    isUnclaimed = !claim;
    c = { title: m.title, personId: claim?claim.personId:null, time: null, reward: m.reward, notes: m.notes, subtasks: m.subtasks||[], isTask:false };
    comp = claim ? { completed: claim.completed, subtaskState: claim.subtaskState||{} } : { completed:false, subtaskState:{} };
  }
  if (!c) return;

  document.getElementById('cdTitle').textContent = c.title;
  document.getElementById('cdMeta').innerHTML = isUnclaimed
    ? `<span class="person-chip bg-gray-200 text-gray-500">Unassigned</span> · <span class="text-pink-500 font-semibold">In the Marketplace</span>`
    : `${personChip(c.personId, c.isTask)} ${c.time?('· '+formatTime(c.time)):''} ${c.isTask?'· <span class=\"text-purple-600 font-semibold\">Personal Task</span>':''}`;

  const rBox = document.getElementById('cdRewardBox');
  if (c.reward && c.reward.enabled && !c.isTask) {

    rBox.innerHTML = `<i class="fa-solid fa-gift"></i> ${rewardLabel(c.reward)}`;
  } else { rBox.classList.add('hidden'); }

  const subs = c.subtasks || [];
  const subBox = document.getElementById('cdSubtasks');
  if (subs.length) {
    subBox.innerHTML = subs.map(s => `<div class="subtask-row">
      <input type="checkbox" class="chk" ${comp.subtaskState[s.id]?'checked':''} ${isUnclaimed?'disabled':''} onchange="toggleSubtask('${s.id}', this.checked)">
      <span class="text-sm ${comp.subtaskState[s.id]?'line-through text-gray-400':'text-gray-700'}">${escapeHtml(s.text)}</span>
    </div>`).join('');
  } else { subBox.innerHTML = ''; }

  const notesEl = document.getElementById('cdNotes');
  if (c.notes) { notesEl.classList.remove('hidden'); notesEl.textContent = c.notes; } else { notesEl.classList.add('hidden'); }

  const btn = document.getElementById('cdCompleteBtn');
  if (isUnclaimed) {
    btn.className = 'flex-1 rounded-xl py-2.5 font-bold text-sm text-white bg-pink-500';

  } else {
    btn.className = 'flex-1 rounded-xl py-2.5 font-bold text-sm text-white ' + (comp.completed ? 'bg-gray-400' : 'bg-emerald-600');
    btn.innerHTML = comp.completed ? '<i class="fa-solid fa-rotate-left"></i> Undo Complete' : '<i class="fa-solid fa-check"></i> Mark Complete';
  }

  const pokeBtn = document.getElementById('cdPokeBtn');
  if (pokeBtn) pokeBtn.classList.toggle('hidden', !!c.isTask);

  const editBtn = document.getElementById('cdEditBtn');
  if (editBtn) editBtn.classList.toggle('hidden', kind === 'market');
  const delBtn = document.getElementById('cdDeleteBtn');
  if (delBtn) delBtn.innerHTML = (kind === 'market' && !isUnclaimed) ? '<i class="fa-solid fa-rotate-left"></i>' : '<i class="fa-solid fa-trash"></i>';

  openModal('choreDetailModal');
}

function toggleSubtask(subId, checked) {
  const { kind, id, dateStr } = currentChoreDetail;
  if (kind === 'single') {
    const c = state.chores.find(x => x.id === id);
    c.subtaskState = c.subtaskState || {};
    c.subtaskState[subId] = checked;
  } else if (kind === 'recurring') {
    const key = id+'_'+dateStr;
    state.recurringCompletions[key] = state.recurringCompletions[key] || { completed:false, subtaskState:{} };
    state.recurringCompletions[key].subtaskState[subId] = checked;
  } else if (kind === 'market') {
    const [marketId, scopeKey] = id.split('::');
    const claim = getMarketClaim(marketId, scopeKey);
    if (!claim) return;
    claim.subtaskState = claim.subtaskState || {};
    claim.subtaskState[subId] = checked;
  }
  persist();
  openChoreDetail(kind, id, dateStr);
  renderSelectedDay(); renderCalendar();
}

function toggleChoreComplete() {
  const { kind, id, dateStr } = currentChoreDetail;
  const today = todayStr();
  
  if (kind === 'single') {
    const c = state.chores.find(x => x.id === id);
    c.completed = !c.completed;
    if (c.completed) {
      c.completedAt = new Date().toISOString();
      if (c.date > today) {
        if (confirm(`Completed early! Update due date from ${c.date} to today (${today})?`)) {
          c.date = today;
        }
      }
      handleRewardOnComplete(c);
    }
  } else if (kind === 'recurring') {
    const key = id+'_'+dateStr;
    state.recurringCompletions[key] = state.recurringCompletions[key] || { completed:false, subtaskState:{} };
    state.recurringCompletions[key].completed = !state.recurringCompletions[key].completed;
    if (state.recurringCompletions[key].completed) {
      state.recurringCompletions[key].completedAt = new Date().toISOString();
      const rule = state.recurring.find(r => r.id === id);
      if (rule) handleRewardOnComplete(rule);
    }
  } else if (kind === 'market') {
    const [marketId, scopeKey] = id.split('::');
    const claim = getMarketClaim(marketId, scopeKey);
    if (!claim) { closeModal('choreDetailModal'); openMarketClaimModal(marketId, scopeKey); return; }
    claim.completed = !claim.completed;
    if (claim.completed) {
      claim.completedAt = new Date().toISOString();
      if (claim.dueDate && claim.dueDate > today) {
        if (confirm(`Completed ahead of time! Update logged date to today (${today}) for immediate stats?`)) {
          claim.dueDate = today;
        }
      }
      const m = state.marketChores.find(x => x.id === marketId);
      if (m) handleRewardOnComplete({ ...m, personId: claim.personId });
    }
  }
  saveState();
  openChoreDetail(kind, id, dateStr);
}

function handleRewardOnComplete(c) {
  if (c.isTask) return;
  if (c.reward && c.reward.enabled && c.reward.banked) {
    state.bankedRewards.push({
      id: uid('bank'), personId: c.personId, choreTitle: c.title,
      reward: { ...c.reward }, date: todayStr(), redeemed: false
    });
    toast((getPerson(c.personId)||{}).name+"'s reward was banked!", 'fa-piggy-bank');
  }
}

function editCurrentChore() {
  if (currentChoreDetail.kind === 'single') openChoreModal(currentChoreDetail.id);
  else if (currentChoreDetail.kind === 'recurring') openChoreModal(null, null, false, currentChoreDetail.id);
  closeModal('choreDetailModal');
}
function deleteCurrentChore() {
  const detail = currentChoreDetail;
  const kind = detail ? detail.kind : 'single';
  if (kind === 'market') {
    const [marketId, scopeKey] = detail.id.split('::');
    const claim = getMarketClaim(marketId, scopeKey);
    if (!claim) { closeModal('choreDetailModal'); return; }
    if (!confirm('Release this chore back to the marketplace?')) return;
    archiveMarketClaimIfCompleted(marketId, scopeKey);
    delete state.marketClaims[marketClaimKey(marketId, scopeKey)];
    closeModal('choreDetailModal');
    saveState();
    return;
  }
  const idToDelete = detail ? detail.id : document.getElementById('choreId').value;
  if (!confirm('Delete this item?')) return;
  if (kind === 'single') state.chores = state.chores.filter(c => c.id !== idToDelete);
  else { state.recurring = state.recurring.filter(r => r.id !== idToDelete); }
  closeModal('choreDetailModal'); closeModal('choreModal');
  saveState();
}
function pokeFromChore() {
  let personId = null;
  if (currentChoreDetail) {
    if (currentChoreDetail.kind === 'market') {
      const [marketId, scopeKey] = currentChoreDetail.id.split('::');
      const claim = getMarketClaim(marketId, scopeKey);
      personId = claim ? claim.personId : null;
    } else {
      const p = state.chores.find(c=>c.id===currentChoreDetail.id) || state.recurring.find(r=>r.id===currentChoreDetail.id);
      personId = p ? p.personId : null;
    }
  }
  closeModal('choreDetailModal');
  openPokeModal(personId);
}

function openChoreModal(choreId, presetDate, isKidLog, recurringId) {
  document.getElementById('choreModalTitle').textContent = (choreId || recurringId) ? 'Edit Item' : 'Add Item';
  document.getElementById('choreId').value = choreId || '';
  document.getElementById('subtaskBuilder').innerHTML = ''; subtaskBuilderCount = 0;
  document.getElementById('rotationStageBuilder').innerHTML = ''; rotationStageCount = 0;
  document.getElementById('chorePerson').innerHTML = personOptions(localDeviceProfileId);
  document.getElementById('recurStart').value = presetDate || todayStr();
  document.getElementById('recurEnd').value = '';
  document.getElementById('recurInterval').value = 1;
  document.getElementById('rotationStageWeeks').value = 1;
  buildRecurDaysGrid([]);
  document.getElementById('choreDeleteBtn').classList.add('hidden');
  document.getElementById('rewardEnabled').checked = false;
  setRewardType('money'); updateRewardUI();
  setItemType('chore');

  if (recurringId) {
    const r = state.recurring.find(x => x.id === recurringId);
    document.getElementById('choreId').value = 'REC:'+recurringId;
    document.getElementById('choreTitle').value = r.title;
    document.getElementById('chorePerson').value = r.personId;
    setItemType(r.isTask ? 'task' : 'chore');
    setChoreRepeatMode('recurring');
    document.getElementById('recurFreq').value = r.frequency;
    if (r.frequency === 'rotation') {
      (r.rotation && r.rotation.stages || []).forEach(s => addRotationStageRow(s.title, s.subtasks));
      document.getElementById('rotationStageWeeks').value = (r.rotation && r.rotation.stageWeeks) || 1;
    }
    updateRecurUI();
    buildRecurDaysGrid(r.daysOfWeek || []);
    document.getElementById('recurDayOfMonth').value = r.dayOfMonth || 1;
    document.getElementById('recurInterval').value = r.interval || 1;
    document.getElementById('recurStart').value = r.startDate;
    document.getElementById('recurEnd').value = r.endDate || '';
    document.getElementById('recurTime').value = r.time || '';
    (r.subtasks||[]).forEach(s => addSubtaskRow(s.text, s.id));
    if (r.reward && r.reward.enabled) {
      document.getElementById('rewardEnabled').checked = true; updateRewardUI();
      setRewardType(r.reward.type);
      document.getElementById('rewardAmount').value = r.reward.amount || '';
      document.getElementById('rewardDesc').value = r.reward.description || '';
      document.getElementById('rewardBanked').checked = !!r.reward.banked;
    }
    document.getElementById('choreNotes').value = r.notes || '';
    document.getElementById('choreDeleteBtn').classList.remove('hidden');
  } else if (choreId) {
    const c = state.chores.find(x => x.id === choreId);
    document.getElementById('choreTitle').value = c.title;
    document.getElementById('chorePerson').value = c.personId;
    setItemType(c.isTask ? 'task' : 'chore');
    setChoreRepeatMode('single');
    document.getElementById('choreDate').value = c.date;
    document.getElementById('choreTime').value = c.time || '';
    (c.subtasks||[]).forEach(s => addSubtaskRow(s.text, s.id));
    if (c.reward && c.reward.enabled) {
      document.getElementById('rewardEnabled').checked = true; updateRewardUI();
      setRewardType(c.reward.type);
      document.getElementById('rewardAmount').value = c.reward.amount || '';
      document.getElementById('rewardDesc').value = c.reward.description || '';
      document.getElementById('rewardBanked').checked = !!c.reward.banked;
    }
    document.getElementById('choreNotes').value = c.notes || '';
    document.getElementById('choreDeleteBtn').classList.remove('hidden');
  } else {
    document.getElementById('choreTitle').value = '';
    document.getElementById('choreDate').value = presetDate || selectedDate || todayStr();
    document.getElementById('choreTime').value = '';
    document.getElementById('choreNotes').value = '';
    document.getElementById('rewardAmount').value = '';
    document.getElementById('rewardDesc').value = '';
    document.getElementById('rewardBanked').checked = false;
    setChoreRepeatMode('single');
    if (isKidLog && localDeviceProfileId) document.getElementById('chorePerson').value = localDeviceProfileId;
  }
  openModal('choreModal');
}

function saveChore() {
  const idRaw = document.getElementById('choreId').value;
  const title = document.getElementById('choreTitle').value.trim();
  if (!title) { toast('Give it a name', 'fa-triangle-exclamation'); return; }
  const personId = document.getElementById('chorePerson').value;
  const isTask = (currentItemType === 'task');
  const subtasks = readSubtasksFromBuilder();
  const rewardEnabled = !isTask && document.getElementById('rewardEnabled').checked;
  const reward = rewardEnabled ? {
    enabled: true, type: rewardType,
    amount: rewardType === 'money' ? Number(document.getElementById('rewardAmount').value || 0) : null,
    description: rewardType === 'other' ? document.getElementById('rewardDesc').value.trim() : null,
    banked: document.getElementById('rewardBanked').checked
  } : { enabled: false };
  const notes = document.getElementById('choreNotes').value.trim();

  if (choreRepeatMode === 'recurring') {
    const isEditingRec = idRaw.startsWith('REC:');
    const freq = document.getElementById('recurFreq').value;
    const ruleData = {
      title, personId, frequency: freq, isTask,
      daysOfWeek: freq === 'weekly' ? getSelectedRecurDays() : [],
      dayOfMonth: freq === 'monthly' ? Number(document.getElementById('recurDayOfMonth').value || 1) : null,
      interval: (freq === 'daily' || freq === 'weekly' || freq === 'monthly') ? Math.max(1, Number(document.getElementById('recurInterval').value || 1)) : 1,
      rotation: freq === 'rotation' ? { stages: readRotationStagesFromBuilder(), stageWeeks: Math.max(1, Number(document.getElementById('rotationStageWeeks').value || 1)) } : null,
      startDate: document.getElementById('recurStart').value || todayStr(),
      endDate: document.getElementById('recurEnd').value || null,
      time: document.getElementById('recurTime').value || null,
      subtasks, reward, notes, active: true
    };
    if (freq === 'rotation' && (!ruleData.rotation.stages || ruleData.rotation.stages.length < 2)) {
      toast('Add at least 2 shifts for a rotating chore', 'fa-triangle-exclamation'); return;
    }
    if (isEditingRec) {
      const rid = idRaw.split(':')[1];
      const r = state.recurring.find(x => x.id === rid);
      Object.assign(r, ruleData);
    } else {
      state.recurring.push({ id: uid('rec'), ...ruleData });
    }
  } else {
    const date = document.getElementById('choreDate').value || todayStr();
    const time = document.getElementById('choreTime').value || null;
    if (idRaw && !idRaw.startsWith('REC:')) {
      const c = state.chores.find(x => x.id === idRaw);
      Object.assign(c, { title, personId, date, time, subtasks, reward, notes, isTask });
    } else {
      state.chores.push({ id: uid('ch'), title, personId, date, time, subtasks, subtaskState:{}, reward, notes, completed:false, loggedByKid: false, isTask });
    }
  }
  closeModal('choreModal');
  saveState();
  toast(isTask ? 'Personal task saved' : 'Chore saved', 'fa-check');
}

  const base = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const shift = getWeekStartSetting() === 'monday' ? 1 : 0;
  return Array.from({length:7}, (_,i) => base[(shift+i)%7]);

function updateMarketScheduleUI() {
  document.getElementById('marketFixedOnceBox').classList.toggle('hidden', !(marketSchedule==='fixed' && marketRepeats==='once'));

  document.getElementById('marketFlexWeeklyBox').classList.toggle('hidden', !(marketSchedule==='flexible' && marketRepeats==='weekly'));

function setMarketRewardType(t) {

  document.getElementById('marketRewardDesc').classList.toggle('hidden', t !== 'other');
  ['marketRewardTypeMoneyBtn','marketRewardTypeOtherBtn'].forEach(bid => {

function addMarketSubtaskRow(text, id) {

function saveMarketChore() {
  const id = document.getElementById('marketId').value;
  const title = document.getElementById('marketTitle').value.trim();
  if (!title) { toast('Give the chore a name', 'fa-triangle-exclamation'); return; }
  const subtasks = readMarketSubtasksFromBuilder();
  const rewardEnabled = document.getElementById('marketRewardEnabled').checked;
  const reward = rewardEnabled ? {
    enabled: true, type: marketRewardType,
    amount: marketRewardType === 'money' ? Number(document.getElementById('rewardAmount').value || 0) : null,
    description: marketRewardType === 'other' ? document.getElementById('rewardDesc').value.trim() : null
  } : { enabled:false };
  const notes = document.getElementById('marketNotes').value.trim();

  const data = { title, subtasks, reward, notes, repeats: marketRepeats, scheduleType: marketSchedule };
  if (marketSchedule === 'fixed' && marketRepeats === 'once') data.dueDate = document.getElementById('marketDueDate').value || todayStr();
  if (marketSchedule === 'fixed' && marketRepeats === 'weekly') data.dueDayOffset = Number(document.getElementById('marketDueDayOfWeek').value || 0);
  if (marketSchedule === 'flexible' && marketRepeats === 'once') {
    data.windowStart = document.getElementById('marketWindowStart').value || todayStr();
    data.windowEnd = document.getElementById('marketWindowEnd').value || data.windowStart;
    if (data.windowEnd < data.windowStart) { toast('Window end must be on or after the start date', 'fa-triangle-exclamation'); return; }
  }
  if (marketSchedule === 'flexible' && marketRepeats === 'weekly') {
    data.windowStartOffset = Number(document.getElementById('marketWindowStartOffset').value || 0);
    data.windowEndOffset = Number(document.getElementById('marketWindowEndOffset').value || 6);
    if (data.windowEndOffset < data.windowStartOffset) {
      const labels = offsetDayLabels();
      toast(`${labels[data.windowEndOffset]} comes before ${labels[data.windowStartOffset]} in your week — pick a later end day`, 'fa-triangle-exclamation');
      return;
    }
  }

  if (id) {
    const m = state.marketChores.find(x => x.id === id);
    Object.assign(m, data);
  } else {
    state.marketChores.push({ id: uid('mkt'), ...data });
  }
  closeModal('marketModal');
  saveState(); renderMarketplace();
  toast('Posted to the marketplace', 'fa-store');
}
function deleteMarketChore() {
  const id = document.getElementById('marketId').value;
  if (!id) return;
  if (!confirm('Delete this listing? Any current claim will be removed too.')) return;
  Object.keys(state.marketClaims).forEach(k => { if (k.startsWith(id+'_')) { const scopeKey = k.slice(id.length+1); archiveMarketClaimIfCompleted(id, scopeKey); delete state.marketClaims[k]; } });
  state.marketChores = state.marketChores.filter(x => x.id !== id);
  closeModal('marketModal');
  saveState(); renderMarketplace();
}
function quickDeleteMarketChore(id) {
  const m = state.marketChores.find(x => x.id === id);
  if (!m) return;
  if (!confirm(`Delete "${m.title}" from the marketplace? Any current claim will be removed too.`)) return;
  Object.keys(state.marketClaims).forEach(k => { if (k.startsWith(id+'_')) { const scopeKey = k.slice(id.length+1); archiveMarketClaimIfCompleted(id, scopeKey); delete state.marketClaims[k]; } });
  state.marketChores = state.marketChores.filter(x => x.id !== id);
  saveState(); renderMarketplace();
}

/* =========================== CHORE LOG TAB (FIXED & SAFE) =========================== */
function renderLog() {
  const filterSel = document.getElementById('logPersonFilter');
  if (filterSel && filterSel.options.length <= 1) {
    filterSel.innerHTML = '<option value="all">Everyone</option>' + personOptions(null);
  }
  const personFilter = filterSel ? filterSel.value : 'all';
  const statusFilter = document.getElementById('logStatusFilter') ? document.getElementById('logStatusFilter').value : 'all';
  const rangeFilter = document.getElementById('logRangeFilter') ? document.getElementById('logRangeFilter').value : 'all';

  const items = [];

  // 1. Single Chores
  (state.chores || []).filter(c => !c.isTask).forEach(c => {
    items.push({
      kind: 'single',
      id: c.id,
      dateStr: c.date || todayStr(),
      title: c.title,
      personId: c.personId,
      time: c.time,
      completed: !!c.completed,
      subtasks: c.subtasks || [],
      reward: c.reward
    });
  });
  
  // 2. Recurring Chores (Iterate safely across 45-day window)
  const today = todayStr();
  for (let i = -45; i <= 45; i++) {
    const curDate = new Date();
    curDate.setDate(curDate.getDate() + i);
    const ds = formatLocalDate(curDate);
    getRecurringForDate(ds).filter(r => !r.isTask).forEach(o => {
      items.push(o);
    });
  }

  // 3. Market Chores
  activeMarketInstances().forEach(x => {
    if (x.claim) {
      items.push({
        kind: 'market',
        id: x.market.id + '::' + x.scopeKey,
        marketId: x.market.id,
        scopeKey: x.scopeKey,
        dateStr: x.claim.dueDate || today,
        title: x.market.title,
        personId: x.claim.personId,
        time: null,
        subtasks: x.market.subtasks || [],
        reward: x.market.reward,
        isTask: false,
        completed: !!x.claim.completed,
        subtaskState: x.claim.subtaskState || {}
      });
    }
  });

  // Filter pipeline
  let filtered = items;

  if (personFilter !== 'all') {
    filtered = filtered.filter(i => i.personId === personFilter);
  }

  if (statusFilter === 'completed') {
    filtered = filtered.filter(i => i.completed);
  } else if (statusFilter === 'pending') {
    filtered = filtered.filter(i => !i.completed);
  }

  if (rangeFilter === 'past7') {
    const p7 = new Date(); p7.setDate(p7.getDate() - 7);
    const p7Str = formatLocalDate(p7);
    filtered = filtered.filter(i => (i.dateStr || today) >= p7Str && (i.dateStr || today) <= today);
  } else if (rangeFilter === 'next7') {
    const n7 = new Date(); n7.setDate(n7.getDate() + 7);
    const n7Str = formatLocalDate(n7);
    filtered = filtered.filter(i => (i.dateStr || today) >= today && (i.dateStr || today) <= n7Str);
  } else if (rangeFilter === 'thisMonth') {
    const mStr = today.slice(0, 7);
    filtered = filtered.filter(i => (i.dateStr || today).startsWith(mStr));
  }

  // Sort newest first
  filtered.sort((a, b) => (b.dateStr || '').localeCompare(a.dateStr || ''));

  const list = document.getElementById('logList');
  if (list) {
    list.innerHTML = filtered.length
      ? filtered.slice(0, 150).map(c => choreRowHtml(c)).join('')
      : '<div class="text-xs text-gray-400 py-6 text-center"><i class="fa-solid fa-list-check text-2xl mb-2 opacity-40 block"></i>No matching chores found.</div>';
  }
}

/* =========================== STATS TAB =========================== */
function periodRange(period) {
  const now = new Date();
  let start, end = new Date(now);
  if (period === 'week') { start = new Date(now); start.setDate(now.getDate()-now.getDay()); }
  else if (period === 'month') { start = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if (period === 'year') { start = new Date(now.getFullYear(), 0, 1); }
  else { start = new Date(now); start.setDate(now.getDate()-30); }
  return { start: formatLocalDate(start), end: formatLocalDate(end) };
}

function completedChoresInRange(start, end) {
  const results = [];
  state.chores.filter(c => !c.isTask).forEach(c => {
    if (c.completed) {
      const compDate = (c.completedAt ? c.completedAt.slice(0,10) : c.date);
      if (compDate >= start && compDate <= end) {
        results.push({ ...c, dateStr: compDate });
      }
    }
  });

  for (let d = parseLocalDate(start); d <= parseLocalDate(end); d.setDate(d.getDate()+1)) {
    const ds = formatLocalDate(d);
    getRecurringForDate(ds).filter(r => !r.isTask).forEach(o => { if (o.completed) results.push(o); });
  }

  allMarketClaimEntries().forEach(x => {
    if (x.claim.completed) {
      const compDate = (x.claim.completedAt ? x.claim.completedAt.slice(0,10) : x.dueDate);
      if (compDate && compDate >= start && compDate <= end) {
        results.push({ kind:'market', dateStr:compDate, title:x.market.title, personId:x.claim.personId, completed:true, subtasks:[] });
      }
    }
  });

  state.marketCompletions.forEach(m => {
    const compDate = (m.completedAt ? m.completedAt.slice(0,10) : m.dueDate);
    if (compDate >= start && compDate <= end) {
      results.push({ kind:'market', dateStr:compDate, title:m.title, personId:m.personId, completed:true, subtasks:[] });
    }
  });
  return results;
}

function renderStats() {
  const period = document.getElementById('statsPeriod').value;
  const { start, end } = periodRange(period);
  const completed = completedChoresInRange(start, end);

  const counts = {};
  state.people.forEach(p => counts[p.id] = 0);
  completed.forEach(c => { if (counts[c.personId] !== undefined) counts[c.personId]++; });

  const ctx = document.getElementById('statsChart').getContext('2d');
  if (window._statsChart) window._statsChart.destroy();
  window._statsChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: state.people.map(p => p.name),
      datasets: [{ data: state.people.map(p => counts[p.id]), backgroundColor: state.people.map(p => p.color), borderRadius: 6 }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{stepSize:1} } } }
  });

  document.getElementById('statsPersonCards').innerHTML = state.people.map(p => {
    const banked = state.bankedRewards.filter(b => b.personId === p.id && !b.redeemed);
    const bankedMoney = banked.filter(b=>b.reward.type==='money').reduce((s,b)=>s+Number(b.reward.amount||0),0);
    return `<div onclick="openStatsPersonDetail('${p.id}')" class="bg-white rounded-2xl shadow-sm p-3 flex items-center justify-between cursor-pointer hover:bg-gray-50">
      <div class="flex items-center gap-2.5">
        <span class="person-dot" style="background:${p.color};width:12px;height:12px"></span>
        <div>
          <div class="font-bold text-sm">${escapeHtml(p.name)}</div>
          <div class="text-[11px] text-gray-500">${counts[p.id]||0} chores completed</div>
        </div>
      </div>
      <div class="text-right flex items-center gap-2">
        <div class="text-sm font-mono font-bold text-purple-600">${bankedMoney>0?'$'+bankedMoney.toFixed(2):(banked.length?banked.length+' banked':'')}</div>
        <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
      </div>
    </div>`;
  }).join('');

  renderBankList();
}

function renderHoneyDo() {
